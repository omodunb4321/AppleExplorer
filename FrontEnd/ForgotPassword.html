<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <title>Forgot Password</title>

        <link rel="stylesheet" href="password.css">
        
    </head>

    <body>
        <script src="ForgotPassword.js"></script>
        <nav class="navbar fixed-top mb-4">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <a class="navbar-brand" href="#" style="color: #F5F5F5;">Agriculture and Agri-Food Canada</a>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="HomePage.html" style="color: #F5F5F5;"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                            </svg> RETURN TO HOMEPAGE</a>
                        </li>
                    </ul>
                </div>

                <!-- Second Row: Menu Items -->
                <div class="d-flex justify-content-end w-100 mt-2">
                    <ul class="navbar-nav flex-row">
                        <li class="nav-item mx-2">
                            <a class="nav-link active" href="homepage.html" style="color: #F5F5F5;">HOME</a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link active" href="dashboard.html" style="color: #F5F5F5;">DASHBOARD</a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link active" href="search.html" style="color: #F5F5F5;">SEARCH</a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link active" href="user-management.html" style="color: #F5F5F5;">MANAGE USER</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-4" style="margin-top: 50px;">
            <div class="row justify-content-center">
                <div class="col-6">
                    <div class="d-flex justify-content-center align-items-center vh-100">
                        <div class="card p-4 mt-3">
                            <div class="card-body">
                                <h5 id="admin-login" class="card-title align-items-center"><strong>RESET PASSWORD</strong></h5>

                                <form>
                                    <div class="row mt-4 mb-4">
                                        <div class="col">
                                            <label for="security-username" class="form-label text-start d-block"><strong>USERNAME</strong></label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="fa fa-user"></i></span>
                                                <input id="security-username" type="text" class="form-control" placeholder="Username" oninput="toggleProceedButton();">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row mb-4">
                                        <div class="col">
                                            <label for="security-password" class="form-label text-start d-block"><strong>VERIFICATION PIN</strong></label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="fa fa-lock"></i></span>
                                                <input type="password" id="security-password" class="form-control" placeholder="Enter Your Verification PIN" oninput="toggleProceedButton();">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="text-center mb-2">
                                        <button type="button" class="btn btn-success" id="login-button" onclick="CheckVPIN(); ">PROCEED</button>
                                        <button type="button" class="btn btn-primary" id="reset-password" onclick="GeneratePIN(); ">REGENERATE</button>
                                    </div>
                                </form>
                                   
                                <p>Check your spam mail for your Verification PIN if you have not immediately received it.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="container-fluid">
            <div class="row">
                <div class="col-6 col-sm-3">
                    <span><i class="fa fa-envelope"></i><strong> CONTACT US</strong></span>
                </div>
                <div class="col">
                    <div class="text-center"><strong>© AGRICULTURAL AND AGRI-FOOD CANADA</strong></div>
                </div>
                <div class="col">
                    <div class="text-end"><strong>TERMS AND CONDITIONS</strong></div>
                </div>
            </div>
        </footer>
    </body>
</html>
