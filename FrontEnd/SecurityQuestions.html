<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">       
        <title>Security Questions</title>
        <link rel="stylesheet" href="security.css">
    </head>

    <body>
        <script src="SecurityQuestions.js"></script>
        <nav class="navbar fixed-top mb-3">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <a class="navbar-brand" href="#" style="color: #F5F5F5;">Agriculture and Agri-Food Canada</a>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="HomePage.html" style="color: #F5F5F5;"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                            </svg> RETURN TO HOMEPAGE</a>
                        </li>
                    </ul>
                </div>

                <!-- Second Row: Menu Items -->
                <div class="d-flex justify-content-end w-100 mt-2">
                    <ul class="navbar-nav flex-row">
                        <li class="nav-item mx-2">
                            <a class="nav-link active" href="homepage.html" style="color: #F5F5F5;">HOME</a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link active" href="dashboard.html" style="color: #F5F5F5;">DASHBOARD</a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link active" href="search.html" style="color: #F5F5F5;">SEARCH</a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link active" href="user-management.html" style="color: #F5F5F5;">MANAGE USER</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-4 mt-3">
            <div class="row justify-content-center">
                <div class="col-6">
                    <div class="d-flex justify-content-center align-items-center vh-100">
                        <div class="card p-4 mt-4" style="min-width: 100%;">
                            <div class="card-body">
                                <form id="security-form">
                                    <!-- Choose mode via URL param or button -->
                                    <input type="hidden" id="user-mode" value="forgot"> <!-- Can be 'forgot' or 'first-time' -->

                                    <!-- FORGOT PASSWORD MODE -->
                                    <div class="row mt-4 mb-4" id="existing-question-group">
                                        <div class="col">
                                            <label for="security-question" class="form-label text-start d-block"><strong>Security Question</strong></label>
                                            <div class="input-group">
                                                <input id="security-question" type="text" class="form-control" disabled readonly value="What is your first pet’s name?" style="min-width: 100%;">
                                            </div>
                                        </div>
                                    </div>

                                    <!-- FIRST-TIME MODE -->
                                    <div class="row mt-4 mb-4 d-none" id="new-question-group">
                                        <div class="col">
                                            <label for="select-question" class="form-label text-start d-block"><strong>Select a Security Question</strong></label>
                                            <div class="input-group">
                                                <select id="select-question" class="form-select">
                                                    <option selected disabled>Choose a question</option>
                                                    <option>What was your childhood nickname?</option>
                                                    <option>What is the name of your first school?</option>
                                                    <option>What is your mother’s maiden name?</option>
                                                    <option>What is your favorite food?</option>
                                                    <option>What was the name of the first school you remember attending?</option>
                                                    <option>What is the name of a college you applied to but didn’t attend?</option>
                                                    <option>Where was the destination of your most memorable school field trip?</option>
                                                    <option>What was the name of your first stuffed toy?</option>
                                                    <option>What was your driving instructor's first name?</option>
                                                    <option>What was your least favourite course?</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- SHARED FIELDS -->
                                    <div class="row mb-4">
                                        <div class="col">
                                            <label for="security-answer" class="form-label text-start d-block"><strong>Security Answer</strong></label>
                                            <div class="input-group">
                                                <input type="text" id="security-answer" class="form-control" placeholder="Enter your security answer">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row mb-4 d-none" id="confirm-answer-row">
                                        <div class="col">
                                            <label for="confirm-answer" class="form-label text-start d-block"><strong>Confirm Security Answer</strong></label>
                                            <div class="input-group">
                                                <input type="text" id="confirm-answer" class="form-control" placeholder="Re-enter your security answer" style="min-width: 100%;">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="text-center mb-2">
                                        <button type="submit" class="btn btn-primary" id="reset-password">Continue</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="container-fluid">
            <div class="row">
                <div class="col-6 col-sm-3">
                    <span><i class="fa fa-envelope"></i><strong> CONTACT US</strong></span>
                </div>
                <div class="col">
                    <div class="text-center"><strong>© AGRICULTURAL AND AGRI-FOOD CANADA</strong></div>
                </div>
                <div class="col">
                    <div class="text-end"><strong>TERMS AND CONDITIONS</strong></div>
                </div>
            </div>
        </footer>
    </body>
</html>
